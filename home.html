        <section class="mainpart">
            <span class="titlesec">
                <h1>For Those Who Dare</h1>
                <p>New collections of the highest quality.</p>
                <button>Shop Trending</button>
            </span>
            <img src="Hero/knightimage.png">
        </section>
        <section class="linesec">
            <span class = "linestitle">
                <h2>You Only Live Once</h2>
                <p>Protect yourself with an armory handcrafted to your liking</p>
            </span>
            <div class = "lines">
                <figure>
                    <img src="Lines/Nuremberg (1).png">
                    <h3>Nuremberg Line</h3>

                </figure>
                    <figure>
                    <img src="Lines/Passau line (1).png">
                    <h3>Passau Wolf Edition</h3>

                </figure>
                    <figure>
                    <img src="Lines/Milan Line.png">
                    <h3>Milan Line</h3>

                </figure>
            </div>
        </section>
        <section class="examples">
            <h2>People who trust us</h2>
            <div class="examplefigs">
                <figure class="leftImgExample">
                    <img src="Examples/Maximilian I.png">
                    <span class="explanation">
                        <h3>Maximilian I</h3>
                        <figcaption>
                            His armies march in our steel.
                        </figcaption>
                    </span>
                </figure>
                <figure class="rightImgExample">
                    <span class="explanation">
                        <h3>Konrad Vogel</h3>
                        <figcaption>
                            Captain of the city watch. Wears our sallet and mail on every patrol.
                        </figcaption>
                    </span>
                    <img src="Examples/Konrad Vogel.png">
                </figure>
                <figure class="leftImgExample">
                    <img src="">
                    <span>
                        <h3></h3>
                        <figcaption>
                            
                        </figcaption>
                    </span>
                </figure>

            <section id="app" class="appsec">
    <div class="apphead">
        <h2>Gunter's Forge</h2>
        <span id="who"></span>
    </div>
    <nav class="tabbar">
        <button data-screen="shop" class="active">Shop</button>
        <button data-screen="orders">My Orders</button>
        <button data-screen="forge">Forge</button>
    </nav>

    <div id="shop" class="screen active">
        <p id="shop-message" class="message"></p>
        <div id="product-list" class="grid"></div>
        <form id="order-form" class="card hidden">
            <h3 id="order-title"></h3>
            <label>Your name
                <input id="order-name" autocomplete="name" required>
            </label>
            <label>Quantity
                <input id="order-qty" type="number" min="1" value="1" required>
            </label>
            <label id="option-wrap"><span id="option-name">Option</span>
                <select id="order-option"></select>
            </label>
            <label>Notes
                <textarea id="order-notes" rows="2"></textarea>
            </label>
            <div class="row">
                <button type="submit">Place order</button>
                <button type="button" id="order-cancel" class="secondary">Cancel</button>
            </div>
        </form>
    </div>

    <div id="orders" class="screen">
        <div id="my-orders"></div>
    </div>

    <div id="forge" class="screen">
        <form id="login-form" class="card hidden">
            <label>Email
                <input id="login-email" type="email" autocomplete="username" required>
            </label>
            <label>Password
                <input id="login-password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Log in</button>
            <p id="login-message" class="message"></p>
        </form>
        <div id="dashboard" class="hidden">
            <div class="row spread">
                <h3>To-do list</h3>
                <button id="logout" class="secondary">Log out</button>
            </div>
            <p id="forge-message" class="message"></p>
            <div id="queue"></div>
            <h3>Materials</h3>
            <div id="materials"></div>
        </div>
    </div>
</section>
