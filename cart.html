<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Your Cart | Gunter</title>
        <meta name="description" content="Review the items in your cart and place your order with Gunter.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/png" href="favicon.png">
    </head>
    <body class="cart-page">
        <header>
            <nav class="navbar">
                <ul>
                    <label for="menu-toggle">
                        <img class ="menu" src="Navbar/three.png">
                    </label>
                    <li class="logo"><a href="home.html"><img src="Navbar/logo2.png"></a></li>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="cart.html"><img class="cart" src="Navbar/cart.png"></a></li>
                    <li><a href="login.html"><img class="login" src="Navbar/login.png"></a></li>
                </ul>        
            </nav>
        </header>
        <!-- hidden checkbox, the hamburger label ticks it and the css slides the side menu in -->
        <input type="checkbox" id="menu-toggle" hidden>
        <nav class="sidenav">
                <label for="menu-toggle" class="close-btn">✕</label>
                <a href="home.html"><button class="sidenavbuttons">Home</button></a>
                <a href="cart.html"><button class="sidenavbuttons">Cart</button></a>
                <a href="login.html"><button class="sidenavbuttons">Log In</button></a>
                <a href="orders.html"><button class="sidenavbuttons">My Orders</button></a>
                <a href="minigame.html"><button class="sidenavbuttons" id="minigameButton">Minigame</button></a>
        </nav>
        <label for="menu-toggle" class="overlay"></label>
        <section class="cartTop">
            <div class = "cartTitle">
                <h1>YOUR CART</h1>
                <a href="orders.html"><p>After you order, check its stage on the My Orders page</p></a>
            </div>
        </section>
        <!-- only shows when the cart has nothing in it, cart.js flips the hidden on this and cart-full -->
        <section id="empty-cart" class="empty-cart" hidden>
            <h2>Your cart is empty</h2>
            <p>The forge is hot and waiting. Browse our lines to find something worth carrying.</p>
            <a href="home.html#linesec" class="orderButton">Shop the Lines</a>
        </section>
<!-- items on the left, order summary + checkout on the right -->
<section id="cart-full" class="summary">
    <div class="checkoutPart" id="cart-items"></div>

    <div class="checkoutPart" id="checkout-panel">
        <h2>Order Summary</h2>
        <div class="cartTotal">
            <p id="item-count">Subtotal</p>
            <p id="cart-total">$0</p>
        </div>

        <form id="checkout-form">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="notes">Notes for Gunter (optional)</label>
            <textarea id="notes" rows="3" placeholder="Engraving, sizing, anything else..."></textarea>

            <button type="submit" class="orderButton" id="place-order">PLACE ORDER</button>
        </form>
        <p id="checkout-message"></p>
        <p>Orders may take a little time to forge. Thank you for your patience.</p>
    </div>
</section>
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
            <script src="supabase.js"></script>
            <script src="cart.js"></script>
    </body>
</html>
