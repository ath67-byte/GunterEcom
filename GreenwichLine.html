<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Greenwich Line | Gunter</title>
        <meta name="description" content="Shop the Greenwich Line from Gunter, the Crown's finest arsenal of armor and weapons, forged to order.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/png" href="favicon.png">
    </head>
    <body>
        <header>
            <nav class="navbar">
                <ul>
                    <label for="menu-toggle">
                        <img class ="menu" src="Navbar/three.png">
                    </label>
                    <li class="logo"><a href="home.html"><img src="Navbar/logo2.png"></a></li>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="cart.html"><img class="cart" src="Navbar/cart.png"></a></li>
                    <li><a href="login.html"><img class="login" src="Navbar/login.png"></a></li>
                </ul>        
            </nav>
        </header>
        <!-- hidden checkbox, the hamburger label ticks it and the css slides the side menu in -->
        <input type="checkbox" id="menu-toggle" hidden>
        <nav class="sidenav">
                <label for="menu-toggle" class="close-btn">✕</label>
                <a href="home.html"><button class="sidenavbuttons">Home</button></a>
                <a href="cart.html"><button class="sidenavbuttons">Cart</button></a>
                <a href="login.html"><button class="sidenavbuttons">Log In</button></a>
                <a href="orders.html"><button class="sidenavbuttons">My Orders</button></a>
        </nav>
        <label for="menu-toggle" class="overlay"></label>
        <!-- big banner with the line name -->
        <section class="topLine">
            <div class="topLineText">
                <h1>Greenwich Line</h1>
                <p>The Crown’s Finest Arsenal</p>
            </div>
            <div class="greenwichImg">
                <img src="Swords/New Medieval Images/Greenwich Line/No Background/Clifford Armor Greenwich.png">
            </div>
        </section>
         <label for="filter-toggle" class="filterbtn">
                <img class ="filter" src="Navbar/filter.png">
                Show Filter 14 Products
            </label>

        <!-- same checkbox trick as the menu but for the filter panel. has to stay right before the nav -->
        <input type="checkbox" id="filter-toggle" hidden>
        <nav class="filternav">
            <label for="filter-toggle" class="close-btn">✕</label>
            <details id="type-of-item">
                <summary>Type of Item</summary>

                    <form>
                        <input type="checkbox" id="itemtype1" name="itemtype1" value="Helmet">
                            <label for="itemtype1"> Helmet</label><br>
                        <input type="checkbox" id="itemtype2" name="itemtype2" value="Sword">
                            <label for="itemtype2"> Sword</label><br>
                        <input type="checkbox" id="itemtype3" name="itemtype3" value="Polearm">
                            <label for="itemtype3"> Polearm</label><br>
                        <input type="checkbox" id="itemtype4" name="itemtype4" value="Dagger">
                            <label for="itemtype4"> Dagger</label><br>
                        <input type="checkbox" id="itemtype5" name="itemtype5" value="Shield">
                            <label for="itemtype5"> Shield</label><br>
                        <input type="checkbox" id="itemtype6" name="itemtype6" value="Body Armor">
                            <label for="itemtype6"> Body Armor</label>
                    </form>
            </details>
            <details id="price-filter">
                <summary>Price Range</summary>

                    <form>
                        <input type="checkbox" id="pricerange1" name="pricerange1" value="0-300">
                            <label for="pricerange1"> Under $300</label><br>
                        <input type="checkbox" id="pricerange2" name="pricerange2" value="300-600">
                            <label for="pricerange2"> $300 – $600</label><br>
                        <input type="checkbox" id="pricerange3" name="pricerange3" value="600-1000">
                            <label for="pricerange3"> $600 – $1,000</label><br>
                        <input type="checkbox" id="pricerange4" name="pricerange4" value="1000+">
                            <label for="pricerange4"> $1,000+</label>
                    </form>
            </details>
            <details id="material-filter">
                <summary>Material</summary>

                    <form>
                        <input type="checkbox" id="materialtype1" name="materialtype1" value="Steel">
                            <label for="materialtype1"> Steel</label>
                    </form>
            </details>
            <details id="availabilty">
                <summary>Availibilty</summary>

                    <form>
                        <input type="checkbox" id="in-stock" name="in-stock" value="in-stock">
                            <label for="in-stock"> In Stock</label><br>
                        <input type="checkbox" id="out-of-stock" name="out-of-stock" value="out-of-stock">
                            <label for="out-of-stock"> Out of Stock</label><br>
                    </form>
            </details>
        </nav>
        <label for="filter-toggle" class="filteroverlay"></label>
        <select name="sort-by" id="sort-by">
            <option value="Trending">Trending</option>
            <option value="AZ">A-Z</option>
            <option value="ZA">Z-A</option>
            <option value="price-low">Price, low to high</option>
            <option value="price-high">Price, high to low</option>
        </select>
<!-- empty on purpose, shop.js drops the product cards in here -->
<section class="lineProducts" id="product-list"></section>
        </section>
        
            <!-- tells shop.js which line to load -->
            <script>const LINE = "Greenwich";</script>
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
            <script src="supabase.js"></script>
            <script src="shop.js"></script>
    </body>
</html>
