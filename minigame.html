<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class = "minigameBackground">
        <header>
            <nav class="navbar">
                <ul>
                    <label for="menu-toggle">
                        <img class ="menu" src="Navbar/three.png">
                    </label>
                    <li class="logo"><a href="home.html"><img src="Navbar/logo2.png"></a></li>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="cart.html"><img class="cart" src="Navbar/cart.png"></a></li>
                    <li><a href="login.html"><img class="login" src="Navbar/login.png"></a></li>
                </ul>        
            </nav>
        </header>
        <!-- hidden checkbox, the hamburger label ticks it and the css slides the side menu in -->
        <input type="checkbox" id="menu-toggle" hidden>
        <nav class="sidenav">
                <label for="menu-toggle" class="close-btn">✕</label>
                <a href="home.html"><button class="sidenavbuttons">Home</button></a>
                <a href="cart.html"><button class="sidenavbuttons">Cart</button></a>
                <a href="login.html"><button class="sidenavbuttons">Log In</button></a>
                <a href="orders.html"><button class="sidenavbuttons">My Orders</button></a>
                <a href="minigame.html"><button class="sidenavbuttons" id="minigameButton">Minigame</button></a>
        </nav>
        <label for="menu-toggle" class="overlay"></label>
        <main class="minigame">
            <h1>Gunter's Mine</h1>
            <p class="minigame-intro">Your order is on the anvil. Grab as many diamonds as you can in 30 seconds.</p>

            <div class="minigame-stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Time: <strong id="time">30</strong></span>
                <span>Best: <strong id="best">0</strong></span>
            </div>

            <canvas id="game" width="480" height="360"></canvas>

            <button id="startButton" class="minigame-start">Start</button>

            <div class="dpad">
                <div class="topDpad">
                    <button class="dpad-btn dpad-up" data-key="ArrowUp">▲</button>
                </div>
                <div class="bottomDpad">
                    <button class="dpad-btn dpad-left" data-key="ArrowLeft">◀</button>
                    <button class="dpad-btn dpad-down" data-key="ArrowDown">▼</button>
                    <button class="dpad-btn dpad-right" data-key="ArrowRight">▶</button>
                </div>
            </div>

            <p class="minigame-help">Use the arrow keys, or the buttons on a phone.</p>
        </main>
    </body>
</html>
