<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Log In | Gunter</title>
        <meta name="description" content="Log in to your Gunter account to place orders and track their progress.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/png" href="favicon.png">
    </head>
    <body class="loginBackground">
        <header>
            <nav class="navbar">
                <ul>
                    <label for="menu-toggle">
                        <img class ="menu" src="Navbar/three.png">
                    </label>
                    <li class="logo"><a href="home.html"><img src="Navbar/logo2.png"></a></li>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="cart.html"><img class="cart" src="Navbar/cart.png"></a></li>
                    <li><a href="login.html"><img class="login" src="Navbar/login.png"></a></li>
                </ul>        
            </nav>
        </header>
        <!-- hidden checkbox, the hamburger label ticks it and the css slides the side menu in -->
        <input type="checkbox" id="menu-toggle" hidden>
        <nav class="sidenav">
                <label for="menu-toggle" class="close-btn">✕</label>
                <a href="home.html"><button class="sidenavbuttons">Home</button></a>
                <a href="cart.html"><button class="sidenavbuttons">Cart</button></a>
                <a href="login.html"><button class="sidenavbuttons">Log In</button></a>
                <a href="orders.html"><button class="sidenavbuttons">My Orders</button></a>
        </nav>
        <label for="menu-toggle" class="overlay"></label>
        <section class="items">
            
            <div class="loginForm">


                <h1>Welcome Back</h1>
                <!-- login.js handles the submit -->
                <form id="login-form">
                    <div class="loginUser">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="loginPass">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <button class ="loginButton" type ="submit">Login</button>
                </form>
                <p id ="login-message"></p>
            </div>    
            

        </section>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
        <script src="supabase.js"></script>
        <script src="login.js"></script>       
    </body>
    
</html>
